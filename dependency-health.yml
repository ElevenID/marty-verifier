    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/gtk-rs/gtk-rs-core
    current: "0.18.5+ElevenID.e60f188"
    target: tauri-gtk4-webkitgtk6-stable-glib-0.20
    status: temporary-exception
    decision: fork
    advisories: [GHSA-wrw7-89jp-8q8g]
    tracking-issue: https://github.com/ElevenID/marty-verifier/issues/31
    review-after: 2026-11-24
    rationale: Tauri v2 Linux still selects glib 0.18. ElevenID pins only the two-line upstream VariantStrIter fix in https://github.com/ElevenID/gtk-rs-core/commit/e60f1885a5168cb823914130e6bdd0e89ec1787c, retained by immutable compatibility tag elevenid-glib-0.18.5-rustsec-2024-0429; remove it when stable Tauri adopts GTK4/WebKitGTK6 and glib 0.20 or later.
