version: 1
dependencies:
  - package: certificate-signature-stack
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/RustCrypto
    current: "x509-cert-0.2/der-0.7/ed25519-dalek-2/rand-0.8/aes-gcm-0.10"
    target: mutually-compatible-current-stable-releases
    status: watch
    decision: upgrade
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-verifier/issues/70
    review-after: 2026-11-07
    rationale: These crates share certificate, signature, random-source, and crypto trait boundaries with marty-core and retained RSA profiles. Upgrade them atomically behind Marty adapters after the verifier conformance suite passes; do not remove supported verification behavior or merge incompatible majors independently.
  - package: keyring
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/hwchen/keyring-rs
    current: "direct-4.1.6/transitive-3.6.3"
    target: "4.1.6-or-later-only"
    status: watch
    decision: upgrade
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-verifier/issues/70
    review-after: 2026-11-07
    rationale: The verifier application now uses keyring 4. marty-secure-storage from marty-core still requires keyring 3, so both majors remain temporarily until the core storage adapter is upgraded and its secure-storage tests pass.
  - package: glib
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/gtk-rs/gtk-rs-core
    current: "0.18.5+ElevenID.e60f188"
    target: tauri-gtk4-webkitgtk6-stable-glib-0.20
    status: temporary-exception
    decision: fork
    advisories: [GHSA-wrw7-89jp-8q8g]
    tracking-issue: https://github.com/ElevenID/marty-verifier/issues/31
    review-after: 2026-11-24
    rationale: Tauri v2 Linux still selects glib 0.18. ElevenID pins only the two-line upstream VariantStrIter fix in https://github.com/ElevenID/gtk-rs-core/commit/e60f1885a5168cb823914130e6bdd0e89ec1787c, retained by immutable compatibility tag elevenid-glib-0.18.5-rustsec-2024-0429; remove it when stable Tauri adopts GTK4/WebKitGTK6 and glib 0.20 or later.
