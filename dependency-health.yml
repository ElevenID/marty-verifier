version: 1
dependencies:
  - package: certificate-signature-stack
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/RustCrypto
    current: "Core-owned cms-0.2.3/x509-cert-0.2.5/der-0.7.10/rsa-0.9.10/ed25519-dalek-2.2.0/rand-0.8.7/aes-gcm-0.10.3"
    target: stable-coordinated-signature-3-certificate-stack
    status: watch
    decision: retain
    advisories: [RUSTSEC-2023-0071]
    tracking-issue: https://github.com/ElevenID/marty-verifier/issues/70
    review-after: 2026-11-15
    rationale: Re-reviewed 2026-11-08 against the crates.io API release and dependency metadata for cms, rsa, x509-cert, der, ed25519-dalek, rand and aes-gcm, plus the current RustSec/OSV RSA advisory. Stable CMS remains 0.2.3 and requires der 0.7, spki 0.7 and x509-cert 0.2; CMS 0.3.0-rc.1 requires the new family and optional RSA 0.10.0-rc.20. Stable RSA remains 0.9.10 with signature 2 and spki 0.7; newest RSA is 0.10.0-rc.22, and RUSTSEC-2023-0071 still identifies no fixed version. Verifier now removes its direct x509-cert, der and ed25519-dalek dependencies in favor of existing Marty DER-only parsing and strict public-signature verification adapters. The obsolete keyring 3 self-check shim and unused keyring 4 declaration are removed, with keyring-core retained through the storage owner. Retain the qualified transitive certificate/CMS/RSA and Core storage families until a compatible stable candidate passes the coordinated migration in issue 70 and Core issue 361. See docs/dependency-review-2026-11-08.md for exact sources, compatibility edges and qualification. Recheck in seven days or on a stable CMS/RSA release; do not remove supported RSA profiles, add local private-key operations, suppress advisories or weaken existing conformance/audit/deny gates.
