[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/marty-entitlements",
    "crates/marty-sync",
    "crates/marty-reporting",
    "crates/marty-app-storage",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
authors = ["Marty Team"]
license = "AGPL-3.0-only"
repository = "https://github.com/ElevenID/marty-verifier"

[workspace.dependencies]
# Tauri
tauri = { version = "2.12.5", features = ["devtools"] }
tauri-build = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "zip"] }

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.39", features = ["bundled-sqlcipher"] }

# Crypto
ring = "0.17"
blake3 = "1.5"
jsonwebtoken = "10.3"

# Platform
directories = "6.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Encoding
base64 = "0.23"
url = "2"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# HTTP client (for sync)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# External crates from marty-core
marty-crypto = { git = "https://github.com/ElevenID/marty-core", rev = "4ddd60bc6872c6202b13abe52691429031760de1", default-features = false }
marty-verification = { git = "https://github.com/ElevenID/marty-core", rev = "4ddd60bc6872c6202b13abe52691429031760de1", default-features = false, features = ["kms-only", "iaca", "csca", "icao-client", "serde"] }
marty-biometrics = { git = "https://github.com/ElevenID/marty-core", rev = "4ddd60bc6872c6202b13abe52691429031760de1", features = ["native", "onnx"] }
marty-secure-storage = { git = "https://github.com/ElevenID/marty-core", rev = "4ddd60bc6872c6202b13abe52691429031760de1" }
marty-types = { git = "https://github.com/ElevenID/marty-core", rev = "4ddd60bc6872c6202b13abe52691429031760de1" }
marty-oid4vci = { git = "https://github.com/ElevenID/marty-core", rev = "4ddd60bc6872c6202b13abe52691429031760de1", default-features = false, features = ["kms-only", "verifier", "jwt_vc_json", "sd_jwt", "mso_mdoc"] }

# Internal crates
marty-entitlements = { path = "crates/marty-entitlements" }
marty-sync = { version = "0.1.4", path = "crates/marty-sync" }
marty-reporting = { path = "crates/marty-reporting", default-features = false }
marty-app-storage = { path = "crates/marty-app-storage" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[patch.crates-io]
# Core requires the verification-only ECDSA compatibility surface.
ecdsa = { git = "https://github.com/ElevenID/ssi-elevenid", rev = "63a9bcce3daf6f45d1e38e43cf687738bb02cb53" }
# Reviewed KMS-only SSI fork; keep all selected SSI and DID crates on one revision.
