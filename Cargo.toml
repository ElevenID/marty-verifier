[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/marty-entitlements",
    "crates/marty-sync",
    "crates/marty-reporting",
    "crates/marty-app-storage",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
authors = ["Marty Team"]
license = "AGPL-3.0-only"
repository = "https://github.com/ElevenID/marty-verifier"

[workspace.dependencies]
# Tauri
tauri = { version = "2.1", features = ["devtools"] }
tauri-build = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-updater = "2.1.0"

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.39", features = ["bundled-sqlcipher"] }

# Crypto
ring = "0.17"
ed25519-dalek = { version = "3.0", features = ["serde"] }
blake3 = "1.5"
jsonwebtoken = "10.3"

# Keychain
keyring = "4.1"

# Platform
directories = "6.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Encoding
base64 = "0.23"
url = "2"

# X.509 parsing
x509-cert = "0.3"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# HTTP client (for sync)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# External crates from marty-core
marty-crypto = { git = "https://github.com/ElevenID/marty-core", rev = "6ee545c16ff6a4c129772049ff1ccc535c421f9f", default-features = false }
marty-verification = { git = "https://github.com/ElevenID/marty-core", rev = "6ee545c16ff6a4c129772049ff1ccc535c421f9f", features = ["serde"] }
marty-biometrics = { git = "https://github.com/ElevenID/marty-core", rev = "6ee545c16ff6a4c129772049ff1ccc535c421f9f", features = ["native", "onnx"] }
marty-secure-storage = { git = "https://github.com/ElevenID/marty-core", rev = "6ee545c16ff6a4c129772049ff1ccc535c421f9f" }
marty-types = { git = "https://github.com/ElevenID/marty-core", rev = "6ee545c16ff6a4c129772049ff1ccc535c421f9f" }
marty-oid4vci = { git = "https://github.com/ElevenID/marty-core", rev = "6ee545c16ff6a4c129772049ff1ccc535c421f9f", features = ["verifier", "jwt_vc_json", "sd_jwt", "mso_mdoc"] }

# Internal crates
marty-entitlements = { path = "crates/marty-entitlements" }
marty-sync = { version = "0.1.4", path = "crates/marty-sync" }
marty-reporting = { path = "crates/marty-reporting", default-features = false }
marty-app-storage = { path = "crates/marty-app-storage" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[patch.crates-io]
ssi-jwt = { git = "https://github.com/ElevenID/ssi-jwt-elevenid", rev = "957c8b0fbf3e4b967fe73c858a22b38e907b3023" }
isomdl = { git = "https://github.com/ElevenID/isomdl-elevenid", rev = "7a443cf6c37c8d7f11e9a767c1002684842ab5d0" }
# Temporary RUSTSEC-2024-0429 backport. Remove with Tauri's GTK4/WebKitGTK6 graph.
glib = { git = "https://github.com/ElevenID/gtk-rs-core.git", rev = "e60f1885a5168cb823914130e6bdd0e89ec1787c" }
