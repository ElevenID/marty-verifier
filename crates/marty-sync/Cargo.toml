[package]
name = "marty-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Trust anchor sync engine for Marty Verifier"
repository.workspace = true

[features]
default = ["aamva", "icao"]
aamva = []  # AAMVA DTS sync
icao = []   # ICAO PKD sync
demo-fixtures = ["dep:anyhow", "dep:const-oid", "dep:getrandom", "dep:rcgen"]

[[bin]]
name = "marty-demo-fixtures"
path = "src/bin/marty-demo-fixtures.rs"
required-features = ["demo-fixtures"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ryu-js = "0.2"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["json"] }

marty-secure-storage.workspace = true
marty-verification.workspace = true

# Certificate parsing
x509-cert = "0.2"
der = { version = "0.7", features = ["std"] }
base64 = "0.22"
blake3 = "1.5"
ed25519-dalek = { workspace = true }
anyhow = { workspace = true, optional = true }
const-oid = { version = "0.9", optional = true }
getrandom = { version = "0.3", optional = true }
# 0.14.8+ requires Rust 1.88; the verifier's documented MSRV is 1.87.
rcgen = { version = "=0.14.7", optional = true }

[dev-dependencies]
tempfile = "3.14"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
keyring-core = "1.0"
