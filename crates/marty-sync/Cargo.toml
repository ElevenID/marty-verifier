[package]
name = "marty-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Trust anchor sync engine for Marty Verifier"
repository.workspace = true

[features]
default = ["native-sync", "aamva", "icao"]
# Policy/profile HTTP clients and PolicyStorage are portable. Native trust-list
# acquisition, encrypted databases and USB import remain opt-in as a unit.
native-sync = ["dep:tokio", "dep:marty-secure-storage", "dep:marty-crypto", "dep:marty-types", "marty-verification/icao-client"]
aamva = ["native-sync"]  # AAMVA DTS sync
icao = ["native-sync"]   # ICAO PKD sync
demo-fixtures = ["native-sync", "dep:anyhow"]

[[bin]]
name = "marty-demo-fixtures"
path = "src/bin/marty-demo-fixtures.rs"
required-features = ["demo-fixtures"]

[[bin]]
name = "marty-emrtd-demo-fixtures"
path = "src/bin/marty-emrtd-demo-fixtures.rs"
required-features = ["demo-fixtures"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ryu-js = "1.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"], optional = true }
tracing.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["json"] }

marty-secure-storage = { workspace = true, optional = true }
marty-crypto = { workspace = true, features = ["eddsa-verification", "x509-parsing"], optional = true }
marty-types = { workspace = true, optional = true }
marty-verification.workspace = true

base64 = "0.23"
blake3 = "1.5"
anyhow = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.14"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
keyring-core = "1.0"
