[package]
name = "marty-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Trust anchor sync engine for Marty Verifier"
repository.workspace = true

[features]
default = ["aamva", "icao"]
aamva = []  # AAMVA DTS sync
icao = []   # ICAO PKD sync
demo-fixtures = [
    "dep:anyhow",
    "dep:const-oid",
    "dep:getrandom",
    "dep:marty-crypto",
    "dep:rcgen",
]

[[bin]]
name = "marty-demo-fixtures"
path = "src/bin/marty-demo-fixtures.rs"
required-features = ["demo-fixtures"]

[[bin]]
name = "marty-emrtd-demo-fixtures"
path = "src/bin/marty-emrtd-demo-fixtures.rs"
required-features = ["demo-fixtures"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ryu-js = "1.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["json"] }

marty-secure-storage.workspace = true
marty-verification.workspace = true
marty-crypto = { workspace = true, optional = true, features = ["sod-builder"] }

# Certificate parsing
x509-cert = "0.3"
der = { version = "0.8", features = ["std"] }
base64 = "0.23"
blake3 = "1.5"
ed25519-dalek = { workspace = true }
anyhow = { workspace = true, optional = true }
const-oid = { version = "0.10", optional = true }
getrandom = { version = "0.4", optional = true }
# 0.14.8+ requires Rust 1.88; the verifier's documented MSRV is 1.87.
rcgen = { version = "=0.14.7", optional = true }

[dev-dependencies]
tempfile = "3.14"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
keyring-core = "1.0"
