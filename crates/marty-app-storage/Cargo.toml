[package]
name = "marty-app-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Secure encrypted storage for Marty Verifier"

[features]
default = []
sqlcipher = ["rusqlite/bundled-sqlcipher"]

[dependencies]
marty-secure-storage.workspace = true
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true

marty-types.workspace = true
marty-sync.workspace = true
marty-verification.workspace = true

[dev-dependencies]
keyring-core = "1.0"
base64 = "0.22"
hex = "0.4"
tempfile = "3.14"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
