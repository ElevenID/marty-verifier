name: Propose Marty Core dependency update

on:
  repository_dispatch:
    types: [marty-core-released]
  workflow_dispatch:
    inputs:
      marty_core_tag:
        description: "Published stable Marty Core tag (for example v0.1.46)"
        required: true
        type: string

permissions: {}

concurrency:
  group: marty-core-dependency-update
  cancel-in-progress: false

jobs:
  propose-update:
    name: Propose exact Core revision
    permissions:
      contents: write # Push only the dedicated automation branch.
      issues: write # Record one bounded, deduplicated failure issue.
      pull-requests: write # Open one draft proposal; maintainers approve its workflow runs.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Normalize requested stable tag
        id: requested
        shell: bash
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          MANUAL_TAG: ${{ inputs.marty_core_tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$MANUAL_TAG"
          else
            tag="$DISPATCH_TAG"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Requested Core tag is not an exact stable semantic version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve published Core tag to one exact commit
        id: core
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          CORE_TAG: ${{ steps.requested.outputs.tag }}
        with:
          github-token: ${{ github.token }}
          result-encoding: json
          script: |
            const owner = "ElevenID";
            const repo = "marty-core";
            const tag = process.env.CORE_TAG;
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            if (release.data.draft || release.data.prerelease || !release.data.published_at) {
              core.setFailed("Core tag must have a published, non-draft, non-prerelease release");
              return;
            }
            const reference = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            let object = reference.data.object;
            for (let depth = 0; object.type === "tag" && depth < 4; depth += 1) {
              const annotated = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha });
              object = annotated.data.object;
            }
            if (object.type !== "commit" || !/^[0-9a-f]{40}$/.test(object.sha)) {
              core.setFailed("Core tag did not peel to one exact commit");
              return;
            }
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${object.sha}...main`,
            });
            if (!["ahead", "identical"].includes(comparison.data.status)) {
              core.setFailed("Core release commit is not on the protected main history");
              return;
            }
            return {
              commit_sha: object.sha,
              release_id: release.data.id,
              published_at: release.data.published_at,
              tag,
              tag_ref_object_sha: reference.data.object.sha,
              tag_ref_object_type: reference.data.object.type,
            };

      - name: Prepare update identity
        id: identity
        shell: bash
        env:
          RESOLUTION: ${{ steps.core.outputs.result }}
        run: |
          set -euo pipefail
          sha="$(jq -r '.commit_sha' <<< "$RESOLUTION")"
          tag="$(jq -r '.tag' <<< "$RESOLUTION")"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved Core commit is malformed."
            exit 1
          fi
          branch="automation/marty-core-${tag#v}-${sha:0:12}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Refuse overlapping or abandoned automation branches
        id: collision
        shell: bash
        env:
          BRANCH: ${{ steps.identity.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --state open --head "$BRANCH" --json number,url --jq '.[0] // empty')"
          if [ -n "$existing" ]; then
            echo "already_open=true" >> "$GITHUB_OUTPUT"
            echo "An exact update PR is already open: $(jq -r '.url' <<< "$existing")"
            exit 0
          fi
          echo "already_open=false" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::The exact automation branch exists without an open PR; refusing to overwrite it."
            exit 1
          fi
          overlapping="$(gh pr list --state open --limit 100 --json number,url,headRefName \
            --jq '[.[] | select(.headRefName | startswith("automation/marty-core-"))][0] // empty')"
          if [ -n "$overlapping" ]; then
            echo "::error::Another Core dependency PR is open: $(jq -r '.url' <<< "$overlapping")"
            exit 1
          fi

      - name: Update all six exact Core pins
        if: steps.collision.outputs.already_open == 'false'
        id: update
        shell: bash
        env:
          CORE_SHA: ${{ steps.identity.outputs.sha }}
          CORE_TAG: ${{ steps.requested.outputs.tag }}
        run: |
          set -euo pipefail
          result="$(python scripts/update_core_dependencies.py \
            --root . --core-tag "$CORE_TAG" --core-sha "$CORE_SHA" --write)"
          echo "changed=$(jq -r '.changed' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$(jq -r '.previous_sha' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "application_version=$(jq -r '.application_version' <<< "$result")" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        if: steps.update.outputs.changed == 'true'

      - name: Update and validate the lockfile
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          CORE_SHA: ${{ steps.identity.outputs.sha }}
          CORE_TAG: ${{ steps.requested.outputs.tag }}
        run: |
          set -euo pipefail
          cargo update \
            -p marty-crypto \
            -p marty-verification \
            -p marty-biometrics \
            -p marty-secure-storage \
            -p marty-types \
            -p marty-oid4vci
          python scripts/update_core_dependencies.py \
            --root . --core-tag "$CORE_TAG" --core-sha "$CORE_SHA" --check
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Run owned automation and workspace tests
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_update_core_dependencies.py
          cargo test --locked --workspace --all-features

      - name: Restrict generated change scope
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 | sed 's/^...//')
          if [ "${#changed[@]}" -ne 2 ]; then
            printf '::error::Expected only Cargo.toml and Cargo.lock; changed paths:\n%s\n' "${changed[*]}"
            exit 1
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.toml|Cargo.lock) ;;
              *) echo "::error::Unexpected generated path: $path"; exit 1 ;;
            esac
          done

      - name: Revalidate the remote tag before publication
        if: steps.update.outputs.changed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          CORE_TAG: ${{ steps.requested.outputs.tag }}
          EXPECTED_SHA: ${{ steps.identity.outputs.sha }}
          RESOLUTION: ${{ steps.core.outputs.result }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = "ElevenID";
            const repo = "marty-core";
            const expected = JSON.parse(process.env.RESOLUTION);
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag: process.env.CORE_TAG });
            if (
              release.data.id !== expected.release_id ||
              release.data.draft ||
              release.data.prerelease ||
              !release.data.published_at ||
              release.data.published_at !== expected.published_at
            ) {
              core.setFailed("Core release identity or publication state changed during dependency preparation");
              return;
            }
            const reference = await github.rest.git.getRef({ owner, repo, ref: `tags/${process.env.CORE_TAG}` });
            if (
              reference.data.object.type !== expected.tag_ref_object_type ||
              reference.data.object.sha !== expected.tag_ref_object_sha
            ) {
              core.setFailed("Core tag root object changed during dependency preparation");
              return;
            }
            let object = reference.data.object;
            for (let depth = 0; object.type === "tag" && depth < 4; depth += 1) {
              const annotated = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha });
              object = annotated.data.object;
            }
            if (object.type !== "commit" || object.sha !== process.env.EXPECTED_SHA) {
              core.setFailed("Core tag identity changed during dependency preparation; no branch will be pushed");
            }

      - name: Commit exact dependency update
        if: steps.update.outputs.changed == 'true'
        id: commit
        shell: bash
        env:
          BRANCH: ${{ steps.identity.outputs.branch }}
          CORE_SHA: ${{ steps.identity.outputs.sha }}
          CORE_TAG: ${{ steps.requested.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git checkout -b "$BRANCH"
          git config user.name "elevenid-dependency-automation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.toml Cargo.lock
          git diff --cached --check
          git commit -m "chore(deps): pin Marty Core ${CORE_TAG} at ${CORE_SHA:0:12}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin "$BRANCH"

      - name: Open protected review PR
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          APPLICATION_VERSION: ${{ steps.update.outputs.application_version }}
          BRANCH: ${{ steps.identity.outputs.branch }}
          CORE_SHA: ${{ steps.identity.outputs.sha }}
          CORE_TAG: ${{ steps.requested.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ steps.update.outputs.previous_sha }}
          RESOLUTION: ${{ steps.core.outputs.result }}
        run: |
          set -euo pipefail
          release_id="$(jq -r '.release_id' <<< "$RESOLUTION")"
          published_at="$(jq -r '.published_at' <<< "$RESOLUTION")"
          body="$(cat <<EOF
          ## Automated dependency proposal

          - Core release: \`${CORE_TAG}\` (release \`${release_id}\`, published \`${published_at}\`)
          - Exact Core commit: \`${CORE_SHA}\`
          - Previous Core commit: \`${PREVIOUS_SHA}\`
          - Verifier application version remains \`${APPLICATION_VERSION}\`

          All six governed Core crates and \`Cargo.lock\` were updated together. The automation ran the owned contract tests, locked metadata validation, and the full locked all-feature Rust workspace suite. This PR never bumps an application version, creates a tag, publishes a release, force-pushes, auto-approves, or auto-merges. Normal PR checks and review remain mandatory.

          No imported, vendor, upstream, external, protocol-compliance, interoperability, conformance test, fixture, assertion, expected result, selection, exclusion, or plan was changed.
          EOF
          )"
          gh pr create --draft --base main --head "$BRANCH" \
            --title "chore(deps): pin Marty Core ${CORE_TAG}" \
            --body "$body"

      - name: Roll back an unpublished exact automation branch
        if: failure() && steps.commit.outputs.sha != ''
        shell: bash
        env:
          BRANCH: ${{ steps.identity.outputs.branch }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_prs="$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')"
          remote_sha="$(git ls-remote --heads origin "$BRANCH" | awk '{print $1}')"
          if [ "$open_prs" != "0" ]; then
            echo "A PR exists for the branch; retaining it."
            exit 0
          fi
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Automation branch head changed or is unavailable; refusing rollback."
            exit 1
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
          echo "Removed unpublished exact automation branch ${BRANCH} at ${EXPECTED_SHA}."

      - name: Record a bounded failure issue
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          CORE_TAG: ${{ steps.requested.outputs.tag }}
        with:
          script: |
            const tag = process.env.CORE_TAG || "invalid-or-unresolved";
            const title = `Core dependency proposal failed for ${tag}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            if (existing.some(issue => !issue.pull_request && issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The protected Core dependency proposal failed before merge or release. Review ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. No tag is created by this workflow.`,
            });
