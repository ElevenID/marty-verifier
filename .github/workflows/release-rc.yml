name: Release RC

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing RC tag to release (e.g., v0.2.0-rc.1)'
        required: true
        type: string

concurrency:
  group: verifier-rc-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release-source:
    name: Validate immutable RC source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      app_version: ${{ steps.identity.outputs.app_version }}
      commit: ${{ steps.identity.outputs.commit }}
      tag_object: ${{ steps.identity.outputs.tag_object }}
    steps:
      - name: Select requested tag
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCHED_TAG: ${{ github.event.inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            tag="$DISPATCHED_TAG"
          else
            tag="$PUSHED_TAG"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::RC release tag is invalid: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind tag, checkout, and application version
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_COMMIT: ${{ github.sha }}
          TAG: ${{ steps.target.outputs.tag }}
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          commit="$(git rev-parse "$TAG^{commit}")"
          tag_object="$(git rev-parse "refs/tags/$TAG")"
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          version="${TAG#v}"
          app_version="${version%-rc.*}"
          if [ "$EVENT_NAME" = push ] && [ "$commit" != "$PUSH_COMMIT" ]; then
            echo "::error::Tag target does not match pushed commit"
            exit 1
          fi
          test "$(git rev-parse 'HEAD^{commit}')" = "$commit"
          python - "$app_version" <<'PY'
          import sys
          from pathlib import Path
          import stable_tag_gate
          versions = stable_tag_gate.application_versions(Path('.'))
          mismatches = [name for name, value in versions.items() if value != sys.argv[1]]
          if mismatches:
              raise SystemExit('RC tag does not match application version: ' + ', '.join(mismatches))
          PY
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "app_version=$app_version"
            echo "commit=$commit"
            echo "tag_object=$tag_object"
          } >> "$GITHUB_OUTPUT"
      - name: Reject an existing draft or published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          python scripts/github_api_retry.py --output releases.json -- \
            --paginate --slurp -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100"
          jq -e --arg tag "$TAG" '([.[][] | select(.tag_name == $tag)] | length) == 0' \
            releases.json >/dev/null

  build-tauri:
    name: Build and smoke ${{ matrix.target }}
    needs: validate-release-source
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.validate-release-source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ui
        run: pnpm build

      - name: Run tests (all features)
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked --workspace --all-features

      - name: Run tests (Intel macOS shipped features)
        if: matrix.target == 'x86_64-apple-darwin'
        run: cargo test --locked --workspace

      - name: Revalidate immutable tag binding
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate-release-source.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate-release-source.outputs.tag_object }}
          TAG: ${{ needs.validate-release-source.outputs.tag }}
        run: |
          set -euo pipefail
          remote_refs="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          test "$(printf '%s\n' "$remote_refs" | awk 'NF { count++ } END { print count + 0 }')" -eq 2
          remote_tag_object="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/$TAG" '$2 == ref { print $1 }')"
          remote_commit="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/$TAG^{}" '$2 == ref { print $1 }')"
          test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"
          test "$remote_commit" = "$EXPECTED_COMMIT"
          test "$(git rev-parse 'HEAD^{commit}')" = "$EXPECTED_COMMIT"

      - name: Build Tauri app without publishing
        id: build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}

      - name: Run packaged startup smoke and bind release assets
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.validate-release-source.outputs.commit }}
          APP_VERSION: ${{ needs.validate-release-source.outputs.app_version }}
          RELEASE_VERSION: ${{ needs.validate-release-source.outputs.version }}
          TARGET: ${{ matrix.target }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          python scripts/packaged_startup_smoke.py stage \
            --repository . \
            --source-sha "$SOURCE_SHA" \
            --application-version "$APP_VERSION" \
            --release-version "$RELEASE_VERSION" \
            --target "$TARGET" \
            --runner-os "$RUNNER_OS_NAME" \
            --output-dir packaged-release

      - name: Upload smoke-gated release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packaged-${{ matrix.target }}
          path: packaged-release
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Publish smoke-gated RC release
    needs:
      - validate-release-source
      - build-tauri
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.validate-release-source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download smoke-gated matrix payloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'packaged-*' --dir release-inputs

      - name: Validate matrix evidence and consolidate assets
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.validate-release-source.outputs.commit }}
          APP_VERSION: ${{ needs.validate-release-source.outputs.app_version }}
          RELEASE_VERSION: ${{ needs.validate-release-source.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/packaged_startup_smoke.py consolidate \
            --input-dir release-inputs \
            --source-sha "$SOURCE_SHA" \
            --application-version "$APP_VERSION" \
            --release-version "$RELEASE_VERSION" \
            --expected-target x86_64-apple-darwin \
            --expected-target aarch64-apple-darwin \
            --expected-target x86_64-unknown-linux-gnu \
            --expected-target x86_64-pc-windows-msvc \
            --release-dir release-assets

      - name: Generate release notes
        shell: bash
        env:
          TAG: ${{ needs.validate-release-source.outputs.tag }}
        run: |
          set -euo pipefail
          cargo install git-cliff
          {
            echo 'macOS artifacts are unsigned and are not Apple-notarized; verify SHA256SUMS, packaged startup evidence, and GitHub build provenance before use.'
            echo
            git cliff --tag "$TAG" --unreleased --strip all
          } > RELEASE_NOTES.md

      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx
          cargo cyclonedx --format json --override-filename marty-verifier-sbom
          cp src-tauri/marty-verifier-sbom.json marty-verifier-sbom.json
          test -s marty-verifier-sbom.json
          jq -e '.metadata.component.name == "marty-verifier"' marty-verifier-sbom.json >/dev/null

      - name: Validate signing artifacts exist
        run: |
          set -euo pipefail
          for pattern in \
            '*_x64.app.tar.gz.sig' \
            '*_aarch64.app.tar.gz.sig' \
            '*_amd64.AppImage.tar.gz.sig' \
            '*_x64-setup.nsis.zip.sig'; do
            mapfile -t matches < <(find release-assets -maxdepth 1 -type f -name "$pattern")
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected one signing artifact matching $pattern, found ${#matches[@]}"
              exit 1
            fi
          done

      - name: Generate canonical updater and integrity metadata
        shell: bash
        env:
          TAG: ${{ needs.validate-release-source.outputs.tag }}
          VERSION: ${{ needs.validate-release-source.outputs.app_version }}
        run: |
          set -euo pipefail
          python scripts/packaged_startup_smoke.py metadata \
            --release-dir release-assets \
            --repository "${{ github.repository }}" \
            --tag "$TAG" \
            --application-version "$VERSION" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --sbom marty-verifier-sbom.json \
            --checksums SHA256SUMS

      - name: Generate attestations for release artifacts
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018
        with:
          subject-path: |
            release-assets/*
            marty-verifier-sbom.json
            SHA256SUMS

      - name: Revalidate immutable tag before publication
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate-release-source.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate-release-source.outputs.tag_object }}
          TAG: ${{ needs.validate-release-source.outputs.tag }}
        run: |
          set -euo pipefail
          remote_refs="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          test "$(printf '%s\n' "$remote_refs" | awk 'NF { count++ } END { print count + 0 }')" -eq 2
          remote_tag_object="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/$TAG" '$2 == ref { print $1 }')"
          remote_commit="$(printf '%s\n' "$remote_refs" | awk -v ref="refs/tags/$TAG^{}" '$2 == ref { print $1 }')"
          test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"
          test "$remote_commit" = "$EXPECTED_COMMIT"
          test "$(git rev-parse 'HEAD^{commit}')" = "$EXPECTED_COMMIT"

      - name: Create RC release after all packaged startup checks pass
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.validate-release-source.outputs.tag }}
          name: Marty Verifier ${{ needs.validate-release-source.outputs.version }} (RC)
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/*
            marty-verifier-sbom.json
            SHA256SUMS
          prerelease: true
          generate_release_notes: true
