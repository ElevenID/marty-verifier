name: Release Stable

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '!v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing prepared stable tag to release (for example v0.2.0)'
        required: true
        type: string

concurrency:
  group: verifier-stable-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release-source:
    name: Validate immutable release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Read the exact successful preparation run and its evidence artifact.
      contents: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.target.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      tag_object: ${{ steps.identity.outputs.tag_object }}
    steps:
      - name: Select requested tag
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCHED_TAG: ${{ github.event.inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            tag="$DISPATCHED_TAG"
          else
            tag="$PUSHED_TAG"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Stable release tag is invalid: $tag"
            exit 1
          fi
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/release-stable.yml@refs/tags/$tag"
          if [ "$WORKFLOW_REF" != "$expected_workflow_ref" ]; then
            echo "::error::Run the stable workflow from the exact release tag ref"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify successful exact-main tag preparation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          tag_type="$(git cat-file -t "refs/tags/$TAG")"
          tag_object="$(git rev-parse "refs/tags/$TAG")"
          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git for-each-ref --format='%(contents)' "refs/tags/$TAG" > tag-message.txt
          run_id="$(sed -n 's/^Preparation-Run: //p' tag-message.txt)"
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          for _ in $(seq 1 36); do
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > preparation-run.json
            status="$(jq -r .status preparation-run.json)"
            conclusion="$(jq -r '.conclusion // ""' preparation-run.json)"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              break
            fi
            sleep 5
          done
          test "$(jq -r .status preparation-run.json)" = completed
          gh run download "$run_id" --name "stable-tag-evidence-$TAG" \
            --dir prepared-tag-evidence
          python scripts/stable_tag_gate.py validate-release \
            --repository-name "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --commit "$commit" \
            --tag-type "$tag_type" \
            --tag-object "$tag_object" \
            --tag-message tag-message.txt \
            --run-json preparation-run.json \
            --evidence prepared-tag-evidence/stable-tag-evidence.json

      - name: Bind tag, checkout, and complete application version state
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_COMMIT: ${{ github.sha }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse "$TAG^{commit}")"
          tag_object="$(git rev-parse "refs/tags/$TAG")"
          if [ "$EVENT_NAME" = push ] && [ "$commit" != "$PUSH_COMMIT" ]; then
            echo "::error::Tag target $commit does not match push commit $PUSH_COMMIT"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python scripts/stable_tag_gate.py validate-source \
            --repository . \
            --tag "$TAG" \
            --commit "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"

      - name: Reject an existing draft or published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          jq -e --arg tag "$TAG" '([.[][] | select(.tag_name == $tag)] | length) == 0' \
            releases.json >/dev/null

  build-tauri:
    name: Build Tauri App
    needs: validate-release-source
    permissions:
      contents: write # Tauri creates the draft release and uploads installers.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.validate-release-source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ui
        run: pnpm build

      - name: Run tests (all features)
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked --workspace --all-features

      - name: Run tests (Intel macOS shipped features)
        if: matrix.target == 'x86_64-apple-darwin'
        run: cargo test --locked --workspace

      - name: Revalidate immutable tag binding
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate-release-source.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate-release-source.outputs.tag_object }}
          TAG: ${{ needs.validate-release-source.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t remote_refs < <(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          test "${#remote_refs[@]}" -eq 2
          test "${remote_refs[0]%%[[:space:]]*}" = "$EXPECTED_TAG_OBJECT"
          test "${remote_refs[1]%%[[:space:]]*}" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "HEAD^{commit}")" = "$EXPECTED_COMMIT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.validate-release-source.outputs.tag }}
          releaseName: 'Marty Verifier ${{ needs.validate-release-source.outputs.version }}'
          releaseBody: 'See changelog for details. macOS artifacts are unsigned and are not Apple-notarized; verify SHA256SUMS and GitHub build provenance before use.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  create-updater-manifest:
    name: Create Auto-Updater Manifest
    permissions:
      contents: write
      id-token: write # Required for attestations.
      attestations: write
    needs:
      - validate-release-source
      - build-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.validate-release-source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        env:
          TAG: ${{ needs.validate-release-source.outputs.tag }}
        run: |
          cargo install git-cliff
          git cliff --tag "$TAG" --unreleased --strip all > RELEASE_NOTES.md

      - name: Install cargo-cyclonedx for SBOM
        run: cargo install cargo-cyclonedx

      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --override-filename marty-verifier-sbom
          # cargo-cyclonedx writes each workspace member's SBOM beside its Cargo.toml.
          cp src-tauri/marty-verifier-sbom.json marty-verifier-sbom.json
          test -s marty-verifier-sbom.json
          jq -e '.metadata.component.name == "marty-verifier"' marty-verifier-sbom.json > /dev/null

      - name: Download release assets
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f
        with:
          tag: ${{ needs.validate-release-source.outputs.tag }}
          fileName: '*'
          out-file-path: 'release-assets'

      - name: Validate signing artifacts exist
        run: |
          MISSING=0
          for pattern in \
            '*_x64.app.tar.gz.sig' \
            '*_aarch64.app.tar.gz.sig' \
            '*_amd64.AppImage.tar.gz.sig' \
            '*_x64-setup.nsis.zip.sig'; do
            mapfile -t matches < <(find release-assets -maxdepth 1 -type f -name "$pattern")
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected one signing artifact matching $pattern, found ${#matches[@]}"
              echo "Ensure TAURI_SIGNING_PRIVATE_KEY is configured in repository secrets."
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi
          echo "All signature files present."

      - name: Generate updater manifest
        env:
          TAG: ${{ needs.validate-release-source.outputs.tag }}
          VERSION: ${{ needs.validate-release-source.outputs.version }}
        run: |
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          resolve_sig() {
            local pattern="$1"
            local match
            match=$(find release-assets -maxdepth 1 -type f -name "$pattern" -print -quit)
            if [ -z "$match" ]; then
              echo "::error::No signing artifact matches $pattern" >&2
              exit 1
            fi
            printf '%s' "$match"
          }

          DARWIN_X64_SIG=$(resolve_sig '*_x64.app.tar.gz.sig')
          DARWIN_AARCH64_SIG=$(resolve_sig '*_aarch64.app.tar.gz.sig')
          LINUX_X64_SIG=$(resolve_sig '*_amd64.AppImage.tar.gz.sig')
          WINDOWS_X64_SIG=$(resolve_sig '*_x64-setup.nsis.zip.sig')

          SIG_DARWIN_X64=$(cat "$DARWIN_X64_SIG")
          SIG_DARWIN_AARCH64=$(cat "$DARWIN_AARCH64_SIG")
          SIG_LINUX_X64=$(cat "$LINUX_X64_SIG")
          SIG_WINDOWS_X64=$(cat "$WINDOWS_X64_SIG")

          URL_DARWIN_X64="${BASE_URL}/$(basename "${DARWIN_X64_SIG%.sig}")"
          URL_DARWIN_AARCH64="${BASE_URL}/$(basename "${DARWIN_AARCH64_SIG%.sig}")"
          URL_LINUX_X64="${BASE_URL}/$(basename "${LINUX_X64_SIG%.sig}")"
          URL_WINDOWS_X64="${BASE_URL}/$(basename "${WINDOWS_X64_SIG%.sig}")"

          # Build manifest with real signatures using jq
          jq -n \
            --arg version "$VERSION" \
            --arg notes "See full release notes at https://github.com/${REPO}/releases/tag/${TAG}" \
            --arg pub_date "$PUB_DATE" \
            --arg sig_darwin_x64 "$SIG_DARWIN_X64" \
            --arg url_darwin_x64 "$URL_DARWIN_X64" \
            --arg sig_darwin_aarch64 "$SIG_DARWIN_AARCH64" \
            --arg url_darwin_aarch64 "$URL_DARWIN_AARCH64" \
            --arg sig_linux_x64 "$SIG_LINUX_X64" \
            --arg url_linux_x64 "$URL_LINUX_X64" \
            --arg sig_windows_x64 "$SIG_WINDOWS_X64" \
            --arg url_windows_x64 "$URL_WINDOWS_X64" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-x86_64": { signature: $sig_darwin_x64, url: $url_darwin_x64 },
                "darwin-aarch64": { signature: $sig_darwin_aarch64, url: $url_darwin_aarch64 },
                "linux-x86_64": { signature: $sig_linux_x64, url: $url_linux_x64 },
                "windows-x86_64": { signature: $sig_windows_x64, url: $url_windows_x64 }
              }
            }' > latest.json

          echo "Generated latest.json with real signatures:"
          cat latest.json

      - name: Generate checksums
        run: |
          # Replace the build-time updater manifest with the signed canonical manifest.
          cp latest.json release-assets/latest.json
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name '*.sig' -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum
          ) > SHA256SUMS
          sha256sum marty-verifier-sbom.json >> SHA256SUMS

      - name: Generate attestations for release artifacts
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018
        with:
          subject-path: |
            release-assets/*
            marty-verifier-sbom.json
            SHA256SUMS

      - name: Revalidate immutable tag before final release update
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate-release-source.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate-release-source.outputs.tag_object }}
          TAG: ${{ needs.validate-release-source.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t remote_refs < <(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          test "${#remote_refs[@]}" -eq 2
          test "${remote_refs[0]%%[[:space:]]*}" = "$EXPECTED_TAG_OBJECT"
          test "${remote_refs[1]%%[[:space:]]*}" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "HEAD^{commit}")" = "$EXPECTED_COMMIT"

      - name: Update release with manifest and notes
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.validate-release-source.outputs.tag }}
          name: Marty Verifier ${{ needs.validate-release-source.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            latest.json
            marty-verifier-sbom.json
            SHA256SUMS
          prerelease: false
          generate_release_notes: true
