name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read # Every CI job only reads repository contents.

jobs:
  dependency-automation-contract:
    name: Dependency Automation Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate dependency and release automation
        run: |
          python scripts/test_update_core_dependencies.py
          python scripts/test_stable_tag_gate.py

  test-rust:
    name: Rust ${{ matrix.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'merge_group' || github.actor == 'dependabot[bot]') && 'READ_ONLY' || 'READ_WRITE' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        task: [tests, clippy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1


      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install cargo-nextest
        if: matrix.task == 'tests'
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d
        with:
          tool: cargo-nextest@0.9.143

      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-inputs-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        if: matrix.task == 'tests'
        run: cargo nextest run --locked --workspace --all-features

      - name: Retain Rust documentation tests
        if: matrix.task == 'tests'
        run: cargo test --locked --doc --workspace --all-features

      - name: Run clippy
        if: matrix.task == 'clippy'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-format:
    name: Rust Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1


      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit &> /dev/null; then
            cargo install cargo-audit --locked
          fi

      - name: Run cargo-audit
        continue-on-error: true
        run: cargo audit

      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny

      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny &> /dev/null; then
            cargo install cargo-deny --locked
          fi

      - name: Run cargo-deny
        continue-on-error: true
        run: cargo deny check

  test-frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

  test-frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm playwright:install

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 30

  ci-gate:
    name: CI Gate
    if: always()
    needs: [dependency-automation-contract, test-rust, rust-format, security, test-frontend-unit, test-frontend-e2e]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Require every CI lane
        shell: bash
        run: |
          for result in $RESULTS; do
            test "$result" = success
          done
      - name: Summarize CI performance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: context.runId});
            const {data} = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: context.runId, filter: 'latest', per_page: 100,
            });
            const created = new Date(run.created_at);
            const rows = data.jobs.filter(job => job.started_at && job.completed_at).map(job => ({
              name: job.name,
              queue: Math.max(0, Math.round((new Date(job.started_at) - created) / 1000)),
              run: Math.max(0, Math.round((new Date(job.completed_at) - new Date(job.started_at)) / 1000)),
            })).sort((a, b) => b.run - a.run);
            const maxQueue = Math.max(0, ...rows.map(row => row.queue));
            core.summary.addHeading('CI performance').addTable([
              [{data: 'Longest jobs', header: true}, {data: 'Queue', header: true}, {data: 'Runtime', header: true}],
              ...rows.slice(0, 10).map(row => [row.name, `${row.queue}s`, `${row.run}s`]),
            ]).addRaw(`Longest observed queue delay: ${maxQueue}s.`);
            if (maxQueue > 300) core.warning(`Runner queue delay reached ${maxQueue}s.`);
            await core.summary.write();
