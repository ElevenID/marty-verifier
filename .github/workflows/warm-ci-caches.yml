name: Warm CI Caches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/warm-ci-caches.yml
      - Cargo.lock
      - '**/Cargo.toml'
      - '**/*.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-ci-caches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Warm Rust cache (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_WRITE
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cache Cargo inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-inputs-${{ hashFiles('**/Cargo.lock') }}
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Compile workspace test targets
        run: cargo test --locked --workspace --all-features --no-run
      - name: Warm clippy cache
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Report compiler cache effectiveness
        if: always()
        run: sccache --show-stats
